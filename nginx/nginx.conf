events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enhanced logging
    log_format detailed_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'upstream_addr="$upstream_addr" '
                           'upstream_status="$upstream_status" '
                           'upstream_response_time="$upstream_response_time" '
                           'request_time="$request_time"';

    access_log /var/log/nginx/access.log detailed_log;
    error_log /var/log/nginx/error.log debug;

    upstream backend {
        server backend:8080;
        # Add health checks
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream frontend {
        server frontend:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Add resolver for DNS resolution
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name idsdock.com www.idsdock.com;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name idsdock.com www.idsdock.com;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/idsdock.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/idsdock.com/privkey.pem;

        # API endpoints
        location /api/ {
            # Debug headers and logging
            add_header X-Debug-Request-URI $request_uri always;
            add_header X-Debug-Upstream $upstream_addr always;
            add_header X-Debug-Host $host always;
            add_header X-Debug-Backend-Status $upstream_status always;

            # Log the request details
            access_log /var/log/nginx/api_access.log detailed_log;
            error_log /var/log/nginx/api_error.log debug;

            # Remove /api prefix and forward to backend
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend:8080;  # Add explicit port
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Increase timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Error handling with detailed messages
            proxy_intercept_errors on;
            error_page 404 = @error404;
            error_page 502 = @error502;
        }

        # WebSocket endpoint
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JSON error handler
        location @error_json {
            default_type application/json;
            return 502 '{"error": "Bad Gateway", "message": "Unable to reach the backend service", "details": "Backend service may be down or unreachable"}';
        }

        # Error handlers with more detail
        location @error404 {
            add_header Content-Type application/json;
            return 404 '{"error": "Not Found", "message": "The requested resource was not found", "path": "$request_uri"}';
        }

        location @error502 {
            add_header Content-Type application/json;
            return 502 '{"error": "Bad Gateway", "message": "Unable to reach the backend service", "upstream": "$upstream_addr"}';
        }
    }
}
